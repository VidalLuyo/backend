apiVersion: apps/v1
kind: Deployment
metadata:
  name: vg-frontend
  namespace: jesus-luyo
  labels:
    app: vg-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vg-frontend
  template:
    metadata:
      labels:
        app: vg-frontend
    spec:
      containers:
      - name: app
        image: vidalluyo0/vg-frontend:1.0
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        env:
        - name: API_URL
          value: "http://localhost:30087/api"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
