# kubectl apply -f 3-service.yml
apiVersion: v1
kind: Service
metadata:
  name: vidal-service
  namespace: vidal-namespace
spec:
  type: NodePort      #30000-32767  # Cambia a LoadBalancer si estás en un entorno de nube
  selector:
    app: vidal-deployment  # Debe coincidir con las etiquetas del Deployment
  ports:
    - protocol: TCP
      port: 8094       # Puerto que el Service expondrá
      targetPort: 8093  # Puerto en el contenedor donde tu aplicación escucha
      nodePort: 30001   # Puerto asignado en el nodo, opcional
